name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test engine
        working-directory: engine
        run: dotnet test --nologo

  unity:
    # No Unity Editor in CI: compile the app's scripts as Unity would (asmdef boundaries, C# 9, netstandard2.1)
    # against UnityEngine 2022.3.62 reference assemblies (third-party NuGet redist, compile-time only), and run
    # the game layer's offline checks against the real engine packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Game layer (Assets/Muchi/Game, no UnityEngine allowed)
        run: dotnet build "unity/Checks~/Muchi.Game" --nologo
      - name: Unity scripts type-check (Integration asmdef + Assembly-CSharp)
        run: dotnet build "unity/Checks~/UnityRuntime" --nologo
      - name: Unity scripts type-check with MUCHI_FIREBASE (against Firebase SDK stubs)
        run: dotnet build "unity/Checks~/UnityFirebase" --nologo
      - name: Game layer checks (input, HUD, course placement, partner mapping, offline races, offline fallback)
        run: dotnet run --project "unity/Checks~/GameChecks"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Test
        working-directory: server
        run: npm test
      # REQ-DLV-008: which manifest keys have files in unity/AssetDelivery~ (and which files have no key). Report only.
      - name: Asset delivery coverage (report, never fails)
        working-directory: server
        continue-on-error: true
        run: npm run scan:assets -- --check --json asset-coverage.json

  # Ops console (tools/ops-console, docs/ops/console.md): offline build + unit tests, then Playwright against wrangler dev
  ops-console:
    needs: [server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Install console deps (Playwright only; the console itself has none)
        working-directory: tools/ops-console
        # The hosted runner image already has Chromium's system libraries; --with-deps only adds
        # fonts via apt. When the Ubuntu mirrors are unreachable, fall back to the browser alone.
        run: |
          npm ci
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Build + unit tests
        working-directory: tools/ops-console
        run: node build.mjs && npm test
      - name: Console e2e
        run: bash scripts/console-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-console-screenshots
          path: tools/ops-console/e2e-screenshots

  integration:
    needs: [engine, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Golden files are up to date
        run: |
          (cd server && npm run gen:golden)
          dotnet run --project engine/Muchi.Verifier -- golden "$PWD/contracts/golden" "$PWD/contracts/ruleset-params.default.json"
          git status --porcelain contracts/golden
          test -z "$(git status --porcelain contracts/golden)"
      - name: Cross-language integration
        run: bash scripts/integration.sh
