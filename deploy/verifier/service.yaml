# Cloud Run service for the C# replay verifier (engine/Muchi.Verifier). One file per environment is rendered from
# this template by the deploy workflows (envsubst):
#   ${SERVICE}   muchi-verifier-staging | muchi-verifier-production
#   ${IMAGE}     <region>-docker.pkg.dev/<project>/muchi/verifier@sha256:...   (immutable digest)
#   ${RUNTIME_SA} verifier-runtime@<project>.iam.gserviceaccount.com             (no roles except secret access)
#   ${MAX_INSTANCES} cost ceiling (staging 3, production 20)
# Apply: gcloud run services replace service.rendered.yaml --region <region>
# Auth model: the service is public at the network level (--allow-unauthenticated equivalent below) and the app
# itself requires `Authorization: Bearer <VERIFIER_AUTH_SECRET>` on POST /verify (VerifierAuth.cs). Only the Worker
# holds the secret (as VERIFIER_TOKEN). See docs/ops/deploy.md for the IAM ID-token alternative.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: muchi-verifier
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: muchi-verifier
      annotations:
        autoscaling.knative.dev/minScale: "0"           # scale to zero: no cost while nobody needs verification
        autoscaling.knative.dev/maxScale: "${MAX_INSTANCES}"
        run.googleapis.com/cpu-throttling: "true"        # CPU only while handling requests (request-based billing)
        run.googleapis.com/startup-cpu-boost: "true"     # faster cold start
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 40                           # a verification is ~tens of ms of CPU; 40 in flight per instance
      timeoutSeconds: 30                                 # the Worker gives up after 10 s anyway
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: VERIFIER_REQUIRE_AUTH
              value: "1"
            - name: VERIFIER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: verifier-auth-secret               # Secret Manager secret (per project = per environment)
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
