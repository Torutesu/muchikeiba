<text x="292.984375" y="237.62" fill="rgb(24, 59, 48)" font-family="&quot;Hiragino Kaku Gothic ProN&quot;, &quot;Noto Sans JP&quot;, sans-serif" font-size="17px" font-weight="700" font-style="normal" letter-spacing="0" opacity="1">配合は、クラブ2日目に開放</text>
