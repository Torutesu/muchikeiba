<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ムチ一閃 / Design Edition 02</title><style>
@font-face{font-family:Club;src:url('fonts/club-sans.otf')}*{box-sizing:border-box}body{margin:0;background:#e8ebe1;color:#203b30;font-family:Club,sans-serif}header{background:#142f27;color:#e6dfc5;padding:40px 5vw 30px;border-bottom:1px solid #a5915d}header small{font-size:10px;letter-spacing:3px;color:#b9a16b}h1{font-family:serif;font-size:30px;letter-spacing:2px;font-weight:400;margin:16px 0}header p{font-size:12px;color:#aabb9f;line-height:1.9}nav{display:flex;gap:10px;flex-wrap:wrap;padding:24px 5vw}button{cursor:pointer;padding:11px 18px;border:1px solid #c3cfb5;border-radius:5px;background:transparent;color:#5b7550;font:11px Club,sans-serif}button[aria-pressed=true]{background:#254b36;color:#e7dfc1;border-color:#254b36}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:0 5vw 40px}article{background:#f7f6ef;border:1px solid #cdd7c0;border-radius:6px;overflow:hidden}article[hidden]{display:none}article img{display:block;width:100%;aspect-ratio:16/11;object-fit:contain;background:#dce4d1}article h2{font-size:13px;font-weight:400;margin:16px 16px 8px}article p{font-size:9px;color:#91a17e;margin:0 16px 17px;line-height:1.9}article a{color:#65824f;text-decoration:none}article .open{display:flex;justify-content:space-between;gap:12px;margin-top:9px}footer{padding:0 5vw 30px;color:#8f9d80;font-size:10px;line-height:1.9}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{grid-template-columns:1fr}header{padding-top:28px}h1{font-size:24px}nav{gap:8px}button{font-size:10px;padding:10px 12px}}
</style></head><body><header><small>THE JOCKEY RACING CLUB / DESIGN EDITION 02</small><h1>ムチ一閃 — 全画面レビュー</h1><p>__COUNT__種類のブラウザ画面。画像を開くと細部まで確認できます。<br>3D・操作・アニメーションはブラウザアプリで確認してください。</p></header><nav aria-label="画面の種類"><button data-group="all" aria-pressed="true">すべて</button><button data-group="core" aria-pressed="false">基本10画面</button><button data-group="detail" aria-pressed="false">詳細・状態</button><button data-group="mobile" aria-pressed="false">モバイル</button></nav><main>__CARDS__</main><footer>PNG は実際のブラウザ表示です。SVG は文字・図形・埋め込み画像の近似変換で、影などに差が残ります。書体を揃える場合は fonts/ の OTF をインストールしてください。<br>LOCAL DESIGN PREVIEW / 対戦・抽選・購入は実行されません。</footer><script>document.querySelectorAll('[data-group]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('article').forEach(card=>card.hidden=button.dataset.group!=='all'&&card.dataset.kind!==button.dataset.group);});</script></body></html>
