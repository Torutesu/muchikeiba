name = "muchi-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# C# verifier service (engine/Muchi.Verifier), scale-to-zero (e.g. Cloud Run)
VERIFIER_URL = "https://verifier.example.invalid"
FIREBASE_PROJECT_ID = "muchi-issen-dev"
VERIFY_SAMPLE_RATE = "0.05"
# DEV_MODE = "1"   # local only: fake store + x-dev-user header. NEVER in production.
# Secrets (wrangler secret put): TICKET_SECRET, ADMIN_TOKENS, GOOGLE_SERVICE_ACCOUNT_JSON
# ADMIN_TOKENS = '[{"name":"alice","role":"admin","sha256":"<sha-256 hex of the token>"}]'   (roles: viewer|operator|admin)
# ADMIN_TOKEN (legacy single token, role admin) still works; prefer ADMIN_TOKENS.
# Optional Cloudflare Access for /v1/admin/*:
# ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
# ACCESS_AUD = "<application AUD tag>"
# ACCESS_ROLES = '{"ops@example.com":"operator"}'
# Stores (server/README.md「ストア連携」). Unset => that store rejects every receipt.
# APPLE_BUNDLE_ID = "jp.example.muchi"
# APPLE_ACCEPT_SANDBOX = "1"              # "0" rejects Sandbox (App Review uses Sandbox)
# GOOGLE_PACKAGE_NAME = "jp.example.muchi"
# GOOGLE_ACCEPT_TEST = "1"                # "0" rejects license-testing purchases
# GOOGLE_PUBSUB_AUDIENCE = "https://api.example.com/v1/store/notifications/google"
# GOOGLE_PUBSUB_SERVICE_ACCOUNT = "rtdn-push@<project>.iam.gserviceaccount.com"

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoomDO"

[[durable_objects.bindings]]
name = "PLAYER"
class_name = "PlayerDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "ACCOUNTING"
class_name = "AccountingDO"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[durable_objects.bindings]]
name = "OPS"
class_name = "OpsDO"

[[durable_objects.bindings]]
name = "INTEGRITY"
class_name = "IntegrityDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoomDO", "PlayerDO", "MatchmakerDO", "AccountingDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardDO", "DirectoryDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OpsDO", "IntegrityDO"]

[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "muchi-replays"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "muchi-public"

# Leaderboard snapshots + season rollover every 5 min; replay retention sweep daily 03:23 JST (src/domain/scheduled.ts)
[triggers]
crons = ["*/5 * * * *", "23 18 * * *"]
