name = "muchi-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# C# verifier service (engine/Muchi.Verifier), scale-to-zero (e.g. Cloud Run)
VERIFIER_URL = "https://verifier.example.invalid"
FIREBASE_PROJECT_ID = "muchi-issen-dev"
VERIFY_SAMPLE_RATE = "0.05"
# DEV_MODE = "1"   # local only: fake store + x-dev-user header. NEVER in production.
# Secrets (wrangler secret put): TICKET_SECRET, ADMIN_TOKEN

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoomDO"

[[durable_objects.bindings]]
name = "PLAYER"
class_name = "PlayerDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "ACCOUNTING"
class_name = "AccountingDO"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoomDO", "PlayerDO", "MatchmakerDO", "AccountingDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardDO", "DirectoryDO"]

[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "muchi-replays"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "muchi-public"

# Leaderboard snapshots + season rollover every 5 min; replay retention sweep daily 03:23 JST (src/domain/scheduled.ts)
[triggers]
crons = ["*/5 * * * *", "23 18 * * *"]
