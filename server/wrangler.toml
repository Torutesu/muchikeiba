name = "muchi-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# C# verifier service (engine/Muchi.Verifier), scale-to-zero (e.g. Cloud Run)
VERIFIER_URL = "https://verifier.example.invalid"
FIREBASE_PROJECT_ID = "muchi-issen-dev"
VERIFY_SAMPLE_RATE = "0.05"
# DEV_MODE = "1"   # local only: fake store + x-dev-user header. NEVER in production.
# Secrets (wrangler secret put): TICKET_SECRET, ADMIN_TOKEN, GOOGLE_SERVICE_ACCOUNT_JSON
# Stores (server/README.md「ストア連携」). Unset => that store rejects every receipt.
# APPLE_BUNDLE_ID = "jp.example.muchi"
# APPLE_ACCEPT_SANDBOX = "1"              # "0" rejects Sandbox (App Review uses Sandbox)
# GOOGLE_PACKAGE_NAME = "jp.example.muchi"
# GOOGLE_ACCEPT_TEST = "1"                # "0" rejects license-testing purchases
# GOOGLE_PUBSUB_AUDIENCE = "https://api.example.com/v1/store/notifications/google"
# GOOGLE_PUBSUB_SERVICE_ACCOUNT = "rtdn-push@<project>.iam.gserviceaccount.com"
# Push notifications (server/README.md「プッシュ通知」). Unset => queued messages are dropped.
# FCM_PROJECT_ID = "muchi-issen-prod"        # defaults to the service account's project_id
# Secrets: FCM_SERVICE_ACCOUNT_JSON (falls back to GOOGLE_SERVICE_ACCOUNT_JSON), KPI_SALT (analytics id hashing)

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoomDO"

[[durable_objects.bindings]]
name = "PLAYER"
class_name = "PlayerDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "ACCOUNTING"
class_name = "AccountingDO"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoomDO", "PlayerDO", "MatchmakerDO", "AccountingDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardDO", "DirectoryDO"]

[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "muchi-replays"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "muchi-public"

# KPI analytics (REQ-KPI-*): rows are written only when KPI_SALT is also set. Queries: docs/ops/kpi-queries.md
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "muchi_kpi"

# Leaderboard snapshots + season rollover every 5 min; replay retention sweep daily 03:23 JST;
# season reminder push daily 12:07 JST (src/domain/scheduled.ts)
[triggers]
crons = ["*/5 * * * *", "23 18 * * *", "7 3 * * *"]
