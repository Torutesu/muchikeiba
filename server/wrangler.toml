# ------------------------------------------------------------------------------------------------ production
[env.production]
name = "muchi-server-production"
workers_dev = false
routes = [{ pattern = "api.REPLACE_ME.example", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
VERIFIER_URL = "https://muchi-verifier-production-REPLACE_ME.a.run.app"
FIREBASE_PROJECT_ID = "REPLACE_ME-production"
VERIFY_SAMPLE_RATE = "0.05"
ASSET_CDN_BASE = "https://assets.REPLACE_ME.example"
APPLE_BUNDLE_ID = "REPLACE_ME.muchi"
# "1" only while App Review needs sandbox IAP against production (sandbox receipts credit FREE coins only;
# TestFlight builds should point at staging). Set "0" once the app is approved. Opt-in: unset = rejected.
APPLE_ACCEPT_SANDBOX = "1"
GOOGLE_PACKAGE_NAME = "REPLACE_ME.muchi"
GOOGLE_ACCEPT_TEST = "0"
GOOGLE_PUBSUB_AUDIENCE = "https://api.REPLACE_ME.example/v1/store/notifications/google"
GOOGLE_PUBSUB_SERVICE_ACCOUNT = "rtdn-push@REPLACE_ME-production.iam.gserviceaccount.com"
