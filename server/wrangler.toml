ENVIRONMENT = "staging"
VERIFIER_URL = "https://muchi-verifier-staging-REPLACE_ME.a.run.app"
FIREBASE_PROJECT_ID = "REPLACE_ME-staging"
VERIFY_SAMPLE_RATE = "0.2"
ASSET_CDN_BASE = "https://assets-staging.REPLACE_ME.example"
APPLE_BUNDLE_ID = "REPLACE_ME.muchi.staging"
APPLE_ACCEPT_SANDBOX = "1"
GOOGLE_PACKAGE_NAME = "REPLACE_ME.muchi.staging"
GOOGLE_ACCEPT_TEST = "1"
GOOGLE_PUBSUB_AUDIENCE = "https://api-staging.REPLACE_ME.example/v1/store/notifications/google"
GOOGLE_PUBSUB_SERVICE_ACCOUNT = "rtdn-push@REPLACE_ME-staging.iam.gserviceaccount.com"
FCM_PROJECT_ID = "REPLACE_ME-staging"

[[env.staging.durable_objects.bindings]]
