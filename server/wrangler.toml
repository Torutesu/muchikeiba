# Cloudflare Worker config. Three environments:
#   (top level)          local development only (`npm run dev`, scripts/integration.sh). Never deployed.
#   [env.staging]        `wrangler deploy --env staging`   (deploy-staging workflow)
#   [env.production]     `wrangler deploy --env production` (deploy-production workflow, manual + approval)
# Wrangler does NOT inherit vars / durable_objects / r2_buckets / analytics_engine_datasets / triggers into [env.*],
# so every environment lists them in full. `npm run lint:deploy -- --env <name>` (scripts/lint-deploy.ts) checks
# that each deployed env is complete, never sets DEV_MODE, keeps secrets out of [vars] and has no REPLACE_ME left.
# Secrets are never written here: `wrangler secret put <NAME> --env <env>` (docs/ops/deploy.md).
name = "muchi-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object migrations apply to every environment's script (each env is a separate Worker).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoomDO", "PlayerDO", "MatchmakerDO", "AccountingDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardDO", "DirectoryDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OpsDO", "IntegrityDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TeamDO", "TeamDirectoryDO", "EventDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TournamentDO"]

# ------------------------------------------------------------------------------------------------ local (dev)
[vars]
ENVIRONMENT = "local"
# C# verifier service (engine/Muchi.Verifier), scale-to-zero (e.g. Cloud Run)
VERIFIER_URL = "https://verifier.example.invalid"
FIREBASE_PROJECT_ID = "muchi-issen-dev"
VERIFY_SAMPLE_RATE = "0.05"
# Asset CDN (REQ-DLV-002): public base of the R2 bucket's custom domain; files at <base>/<platform>/<sha256>/<file>.
# Placeholder locally: clients then fall back to bundled assets / <kind>/default. Not a secret.
ASSET_CDN_BASE = "https://assets.example.invalid"
# DEV_MODE = "1"   # local only (pass with --var DEV_MODE:1): fake store + x-dev-user header. Refused when ENVIRONMENT is staging/production.
# Secrets (wrangler secret put): TICKET_SECRET, VERIFIER_TOKEN, ADMIN_TOKENS, GOOGLE_SERVICE_ACCOUNT_JSON, FCM_SERVICE_ACCOUNT_JSON, KPI_SALT
# ADMIN_TOKENS = '[{"name":"alice","role":"admin","sha256":"<sha-256 hex of the token>"}]'   (roles: viewer|operator|admin)
# ADMIN_TOKEN (legacy single token, role admin) still works; prefer ADMIN_TOKENS.
# Rewarded ads (REQ-AD-006, contracts/protocol.md §21). Unset => GET /v1/ads/ssv/admob is 404 and no ad reward is ever granted.
# ADS_SSV_KEYS_URL = "<the ad network's published SSV verifier-keys JSON URL>"   (not a secret; set per env when ads go live)
# ADS_AD_UNITS = '{"REWARDED_HOME":"<ad unit id>","REWARDED_RESULT":"<ad unit id>","REWARDED_TA":"<ad unit id>"}'
# Optional Cloudflare Access for /v1/admin/*: ACCESS_TEAM_DOMAIN, ACCESS_AUD, ACCESS_ROLES
# Stores (server/README.md「ストア連携」). Unset => that store rejects every receipt:
#   APPLE_BUNDLE_ID, APPLE_ACCEPT_SANDBOX, GOOGLE_PACKAGE_NAME, GOOGLE_ACCEPT_TEST, GOOGLE_PUBSUB_AUDIENCE, GOOGLE_PUBSUB_SERVICE_ACCOUNT
# Push notifications: FCM_PROJECT_ID (+ secret FCM_SERVICE_ACCOUNT_JSON). KPI: secret KPI_SALT.

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoomDO"

[[durable_objects.bindings]]
name = "PLAYER"
class_name = "PlayerDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "ACCOUNTING"
class_name = "AccountingDO"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[durable_objects.bindings]]
name = "OPS"
class_name = "OpsDO"

[[durable_objects.bindings]]
name = "INTEGRITY"
class_name = "IntegrityDO"

# 支部 (REQ-TEAM-*): one object per team + a singleton search directory
[[durable_objects.bindings]]
name = "TEAMS"
class_name = "TeamDO"

[[durable_objects.bindings]]
name = "TEAM_DIRECTORY"
class_name = "TeamDirectoryDO"

# event races (REQ-EVENT-*): one object per event `ev:<eventId>`
[[durable_objects.bindings]]
name = "EVENTS"
class_name = "EventDO"

[[durable_objects.bindings]]
name = "TOURNAMENTS"
class_name = "TournamentDO"

[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "muchi-replays"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "muchi-public"

# KPI analytics (REQ-KPI-*): rows are written only when KPI_SALT is also set. Queries: docs/ops/kpi-queries.md
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "muchi_kpi"

# Leaderboard snapshots + season rollover every 5 min; replay retention sweep daily 03:23 JST;
# season reminder push daily 12:07 JST (src/domain/scheduled.ts)
[triggers]
crons = ["*/5 * * * *", "23 18 * * *", "7 3 * * *"]

# ------------------------------------------------------------------------------------------------ staging
[env.staging]
name = "muchi-server-staging"
workers_dev = false
routes = [{ pattern = "api-staging.REPLACE_ME.example", custom_domain = true }]

