[[env.staging.durable_objects.bindings]]
name = "ACCOUNTING"
class_name = "AccountingDO"

[[env.staging.durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardDO"

[[env.staging.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[env.staging.durable_objects.bindings]]
name = "OPS"
class_name = "OpsDO"

[[env.staging.durable_objects.bindings]]
name = "INTEGRITY"
class_name = "IntegrityDO"

[[env.staging.durable_objects.bindings]]
name = "TEAMS"
class_name = "TeamDO"

[[env.staging.durable_objects.bindings]]
name = "TEAM_DIRECTORY"
class_name = "TeamDirectoryDO"

[[env.staging.durable_objects.bindings]]
name = "EVENTS"
class_name = "EventDO"

[[env.staging.durable_objects.bindings]]
